hostname EDGE-RTR-01
!
enable password cisco
!
ip domain-name corp.local
ip ssh version 2
ip http server
!
interface GigabitEthernet0/0
 description Uplink to Core
 ip address 10.10.1.1 255.255.255.252
 no shutdown
!
line con 0
 login local
!
line vty 0 4
 login local
 transport input telnet ssh
!
end
